<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МобилМаркет Москва - Корзина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cart">
    <header class="hero">
      <div class="hero__content container">
        <div>
          <p class="hero__badge">Москва • демонстрационный сайт</p>
          <h1>Корзина</h1>
          <p class="hero__subtitle">Проверьте товары и оформите заказ.</p>
        </div>
        <div class="hero__meta">
          <button id="cartBtn" class="cart-btn">Товаров: <strong id="cartCount">0</strong></button>
        </div>
      </div>
    </header>

    <nav class="container top-nav">
      <a href="index.html">Каталог</a>
      <a href="cart.html">Корзина</a>
      <a href="contacts.html">Контакты</a>
    </nav>

    <main class="container">
      <section id="cartSection" class="cart-panel">
        <h2>Ваши товары</h2>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-summary">
          <p>Товаров: <strong id="cartItemsCount">0</strong></p>
          <p>Сумма: <strong id="cartTotal">0 ₽</strong></p>
          <button id="orderBtn" class="order-btn">Заказать</button>
        </div>
      </section>
    </main>

    <footer class="demo-footer">Этот сайт является примером и демонстрацией для портфолио.</footer>
    <script src="script.js"></script>
  </body>
</html>
